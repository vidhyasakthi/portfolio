<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Young+Serif&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
    <div class="section-one">
        <h1 class="section-one__name">Vidhya</h1>
        <p class="section-one__role">Web Developer</p>
    
        <a class="section-one__contact" href="portfolio.html">Home</a>
    </div>
    <div class="contact-form">
    <form>
        <table>
            <tr>
            <td><label>Name:</label></td>
            <td><input type="text" placeholder="Enter your Name" required class="contact-form_input"></td>
        </tr>
        <tr>
            <td><label>Email:</label></td>
            <td><input type="email" placeholder="Enter your Email" required class="contact-form_input"></td>
        </tr>
        <tr></tr>
            <td><label>Message:</label></td>
            <td><textarea placeholder="Message" class="contact-form_textarea"></textarea></td>
        </tr>
        <tr>   
            <td></td>
            <td><input type="button" value="Submit" class="contact-form_submit"></td>
        </tr> 
        </table>
        
    </form>
    </div>
    <div class="section-five">
        <p class="section-five__title">Social Media:
            <a href="#">Instagram</a>
            <a href="#">Facebook</a>
            <a href="#">linkedIn</a>
        </p>  
        <p class="section-five__desc">&copy; Vidhya</p>
    </div>
</div>   
</body>

</html>
